name: Deploy no GitHub Pages

# Publica a edição estática do Oráculo (motor local rodando no navegador).
# O export é gerado por `npm run build:pages` e verificado por `verify:pages`
# antes de subir — um build quebrado não substitui a página no ar.
#
# Pré-requisito (uma única vez, no painel do repositório):
#   Settings → Pages → Source = "GitHub Actions"
# Enquanto o Pages não estiver ativado, o build roda e valida normalmente, o
# artefato fica disponível no run e a publicação é apenas ignorada.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela um deploy já em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Calcular subcaminho
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Checar tipos
        run: npm run typecheck

      # Portão de acessibilidade: falha o deploy em regressões objetivas
      # (contraste, teclado, nome acessível, HTML inválido).
      - name: Auditar acessibilidade
        run: npm run audit:a11y

      - name: Build estático
        env:
          PAGES_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build:pages

      - name: Verificar artefato
        env:
          PAGES_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run verify:pages

      - name: Pages está ativado?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages ativo — seguindo para o deploy."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages desativado::O site está construído e verificado, mas o Pages ainda não foi ativado. Ative em Settings → Pages → Source = GitHub Actions e rode este workflow novamente (Actions → Deploy no GitHub Pages → Run workflow)."
          fi

      - name: Configurar Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Empacotar
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
